apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: demo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-readonly
  namespace: demo
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - events
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-readonly
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: demo
roleRef:
  kind: Role
  name: sre-readonly
  apiGroup: rbac.authorization.k8s.io