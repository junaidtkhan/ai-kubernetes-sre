apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: checkout
          image: postgres:16
          command:
            - /bin/bash
            - -c
          args:
            - |
              echo "Connecting to database..."
              until pg_isready -d "$DATABASE_URL"; do
                echo "Database not ready, retrying..."
                sleep 2
              done
              echo "Database connection successful"
              while true; do sleep 3600; done
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:password@postgres:5432/orders"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"